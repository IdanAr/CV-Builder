<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- The browser-tab mark. Derived from the navbar logo in
       components/ui/AppNavbar.tsx, but deliberately not a copy of it: that mark
       carries six satellite dots and six connector lines at r=4 / strokeWidth=2,
       which at a 16px favicon render as sub-pixel smudges. Only the hexagon and
       the spark survive the reduction, scaled up to fill the frame.

       The plate is solid rather than transparent because the mark's violet
       (#7C3AED) measures 5.9:1 on a white tab strip but only 2.4:1 on a dark
       one — a transparent icon would half-disappear for anyone using a dark
       browser theme. A filled plate keeps the glyph legible on both.

       Violet, not the indigo accent token: this is the product's existing brand
       mark, and a completeness pass is the wrong place to re-tint a logo. -->
  <rect width="100" height="100" rx="22" fill="#7C3AED" />
  <polygon points="50,18 74,32 74,68 50,82 26,68 26,32" fill="#A78BFA" />
  <path d="M 38 44 L 47 44 L 50 38 L 53 44 L 62 44 L 56 53 L 59 62 L 50 56 L 41 62 L 44 53 Z"
    fill="#FFFFFF" />
</svg>
