<!-- @dsCard group="Type" viewport="700x250" name="App type scale — Inter" subtitle="The product chrome runs on Inter, 12→60px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--app-bg); padding: 20px; color: var(--text-heading); }
  .r { display: flex; align-items: baseline; gap: 14px; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
  .r:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); width: 96px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="r"><span class="meta">60 · 800</span><span style="font-size:40px;font-weight:800;letter-spacing:-.02em">Build your CV</span></div>
  <div class="r"><span class="meta">24 · 700</span><span style="font-size:24px;font-weight:700">My CVs</span></div>
  <div class="r"><span class="meta">20 · 700</span><span style="font-size:20px;font-weight:700">Senior Product Designer</span></div>
  <div class="r"><span class="meta">16 · 600</span><span style="font-size:16px;font-weight:600">Section heading</span></div>
  <div class="r"><span class="meta">14 · 400</span><span style="font-size:14px">Body copy and form controls use 14px.</span></div>
  <div class="r"><span class="meta">12 · 500</span><span style="font-size:12px;font-weight:500;color:var(--text-muted)">META · BADGES · CAPTIONS</span></div>
</body>
</html>
