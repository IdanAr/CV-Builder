<!-- @dsCard group="Spacing" viewport="700x180" name="Glassmorphism" subtitle="The signature frosted surface: 65% white + 20px backdrop blur" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); padding: 24px;
    background: linear-gradient(120deg, #c7d2fe, #e9d5ff 50%, #f5f3ff);
    display: flex; gap: 16px; align-items: center; }
  .glass { flex: 1; background: var(--surface-card); backdrop-filter: blur(var(--blur-glass));
    -webkit-backdrop-filter: blur(var(--blur-glass)); border: 1px solid var(--border-glass);
    border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); padding: 18px; }
  .nav { flex: 1; background: var(--surface-nav); backdrop-filter: blur(var(--blur-glass));
    border-bottom: 1px solid var(--border-glass); border-radius: var(--radius-full);
    box-shadow: var(--shadow-md); padding: 14px 20px; }
  h4 { margin: 0 0 6px; font-size: 14px; color: var(--text-heading); }
  p { margin: 0; font-size: 12px; color: var(--text-muted); }
  code { font-family: var(--font-mono); font-size: 11px; color: var(--indigo-600); }
</style>
</head>
<body>
  <div class="glass"><h4>Glass card</h4><p><code>surface-card</code> · blur 20 · shadow-lg · radius-xl</p></div>
  <div class="nav"><h4>Nav pill</h4><p><code>surface-nav</code> · radius-full</p></div>
</body>
</html>
