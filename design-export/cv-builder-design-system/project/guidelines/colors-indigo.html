<!-- @dsCard group="Colors" viewport="700x150" name="Indigo / Violet ramp" subtitle="Primary brand hue — indigo-600 is the action color" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--app-bg); padding: 18px; }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.04); }
  .n { font-size: 11px; color: var(--text-body); margin-top: 6px; }
  .h { font-size: 10px; color: var(--text-faint); font-family: var(--font-mono); }
  .star { outline: 2px solid var(--indigo-600); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="row" id="r"></div>
  <script>
    const ramp = [['50','#eef2ff'],['100','#e0e7ff'],['200','#c7d2fe'],['300','#a5b4fc'],['400','#818cf8'],['500','#6366f1'],['600','#4f46e5'],['700','#4338ca'],['900','#312e81'],['950','#1e1b4b']];
    document.getElementById('r').innerHTML = ramp.map(([n,h]) =>
      `<div class="sw"><div class="chip ${n==='600'?'star':''}" style="background:${h}"></div><div class="n">${n}</div><div class="h">${h}</div></div>`).join('');
  </script>
</body>
</html>
