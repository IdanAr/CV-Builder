<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing scale" subtitle="4px base step — gaps, padding, stacks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--app-bg); padding: 20px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .b { background: var(--brand-gradient-br); border-radius: var(--radius-sm); }
  .c { text-align: center; }
  .n { font-size: 10px; color: var(--text-body); margin-top: 6px; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="row" id="r"></div>
  <script>
    const steps = [['1',4],['2',8],['3',12],['4',16],['6',24],['8',32],['12',48],['16',64]];
    document.getElementById('r').innerHTML = steps.map(([n,px]) =>
      `<div class="c"><div class="b" style="width:${px}px;height:${px}px"></div><div class="n">${n}·${px}</div></div>`).join('');
  </script>
</body>
</html>
