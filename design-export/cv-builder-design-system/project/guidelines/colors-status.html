<!-- @dsCard group="Colors" viewport="700x150" name="Status & document ink" subtitle="ATS score semantics + the neutral palette of the CV canvas" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--app-bg); padding: 18px; display: flex; gap: 24px; }
  .col { flex: 1; }
  .lbl { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; text-align: center; }
  .chip { height: 44px; border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.06); }
  .n { font-size: 10px; color: var(--text-body); margin-top: 5px; }
</style>
</head>
<body>
  <div class="col">
    <p class="lbl">Status — ATS score</p>
    <div class="row" id="s"></div>
  </div>
  <div class="col">
    <p class="lbl">Document ink (CV canvas)</p>
    <div class="row" id="d"></div>
  </div>
  <script>
    const status = [['good','#16a34a'],['warn','#eab308'],['bad','#ef4444']];
    const doc = [['paper','#ffffff'],['ink','#000000'],['secondary','#555555'],['muted','#666666'],['primary','#1f2937'],['accent','#2563eb']];
    const r = a => a.map(([n,h]) => `<div class="sw"><div class="chip" style="background:${h}"></div><div class="n">${n}</div></div>`).join('');
    document.getElementById('s').innerHTML = r(status);
    document.getElementById('d').innerHTML = r(doc);
  </script>
</body>
</html>
