<!-- @dsCard group="CV Builder App" viewport="1200x760" name="CV Builder — app" subtitle="Sign-in → dashboard → editor with live résumé preview" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CV Builder — App</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-ui); color: var(--text-heading);
    background: radial-gradient(1200px 600px at 70% -10%, #e9d5ff55, transparent),
                radial-gradient(900px 500px at -10% 10%, #c7d2fe55, transparent), var(--app-bg); }
  #app { height: 100%; overflow: hidden; }
  .scroll { overflow: auto; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 8px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./kit-screens.jsx"></script>
<script type="text/babel" src="./kit-editor.jsx"></script>
</head>
<body>
<div id="app"></div>
<script type="text/babel">
  const NS = window.CVBuilderDesignSystem_1d5ed3;
  const { Button, Tabs, Avatar, SampleResume, SampleMeta } = NS;
  const { Navbar, ProfilePill, DashboardScreen, TEMPLATES } = window.CVKit;
  const { EditPanel, DesignPanel, AtsPanel } = window.CVKitEditor;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function EditorScreen({ onBack }) {
    const [tab, setTab] = React.useState('design');
    const [data, setData] = React.useState(() => clone(SampleResume));
    const [meta, setMetaState] = React.useState(() => ({
      templateId: 'modern', layout: 'single-column',
      fontFamily: 'Lato', headerFontFamily: 'Lato',
      primaryColor: '#4338ca', accentColor: '#6366f1',
      pageMargins: 1.0, lineSpacing: 1.15,
      sectionOrder: ['work', 'education', 'skills', 'volunteer', 'languages'], columnAssignment: {},
    }));
    const setMeta = (patch) => setMetaState((m) => ({ ...m, ...patch }));
    const setBasics = (k, v) => setData((d) => ({ ...d, basics: { ...d.basics, [k]: v } }));

    const Template = TEMPLATES[meta.templateId] || TEMPLATES.classic;
    const scale = 0.6;

    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        <Navbar
          left={<>
            <a onClick={onBack} style={{ cursor: 'pointer', fontSize: 14, fontWeight: 500, color: 'var(--brand-primary)' }}>← My CVs</a>
            <span style={{ color: 'var(--border-default)' }}>|</span>
            <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>Saved</span>
            <div style={{ width: 1, height: 16, background: 'var(--border-default)' }} />
            <Button size="sm" variant="secondary">JSON</Button>
            <Button size="sm">PDF</Button>
            <Button size="sm">DOCX</Button>
          </>}
          right={<ProfilePill />} />

        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          {/* Left control panel */}
          <div style={{ width: 440, flexShrink: 0, display: 'flex', flexDirection: 'column',
            background: 'var(--surface-panel)', backdropFilter: 'blur(var(--blur-glass))',
            WebkitBackdropFilter: 'blur(var(--blur-glass))', borderRight: '1px solid var(--border-glass)' }}>
            <div style={{ display: 'flex', alignItems: 'center', height: 46, padding: '0 16px',
              borderBottom: '1px solid var(--border-subtle)', background: 'rgba(255,255,255,0.5)' }}>
              <input defaultValue="Product Design — 2026" style={{ flex: 1, border: 'none', background: 'transparent',
                outline: 'none', fontSize: 14, fontWeight: 600, color: 'var(--text-heading)' }} />
            </div>
            <div style={{ background: 'rgba(255,255,255,0.5)' }}>
              <Tabs tabs={[{ id: 'edit', label: 'Edit' }, { id: 'design', label: 'Design' }, { id: 'ats', label: 'ATS' }]} active={tab} onChange={setTab} />
            </div>
            <div className="scroll" style={{ flex: 1, minHeight: 0 }}>
              {tab === 'edit' && <EditPanel data={data} setBasics={setBasics} />}
              {tab === 'design' && <DesignPanel meta={meta} setMeta={setMeta} />}
              {tab === 'ats' && <AtsPanel />}
            </div>
          </div>

          {/* Live preview */}
          <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', background: 'rgba(255,255,255,0.25)' }}>
            <div style={{ display: 'flex', alignItems: 'center', height: 46, padding: '0 16px',
              borderBottom: '1px solid var(--border-subtle)', background: 'rgba(255,255,255,0.5)' }}>
              <span style={{ fontSize: 12, fontWeight: 500, color: 'var(--text-muted)' }}>Live Preview</span>
            </div>
            <div className="scroll" style={{ flex: 1, minHeight: 0, display: 'flex', justifyContent: 'center', padding: 28 }}>
              <div style={{ width: 794 * scale, height: 1123 * scale, flexShrink: 0, position: 'relative' }}>
                <div style={{ position: 'absolute', top: 0, left: 0, width: 794, transformOrigin: 'top left',
                  transform: `scale(${scale})`, boxShadow: 'var(--shadow-xl)' }}>
                  <Template data={data} meta={meta} />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function App() {
    const [route, setRoute] = React.useState('dashboard');
    return (
      <div id="app-inner" style={{ height: '100%' }}>
        {route === 'dashboard' && <DashboardScreen onOpen={() => setRoute('editor')} />}
        {route === 'editor' && <EditorScreen onBack={() => setRoute('dashboard')} />}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
