<!-- @dsCard group="Components" viewport="700x240" name="CV templates" subtitle="Classic · Modern · Minimal · Executive · Sidebar — rendered from one dataset" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--app-bg); padding: 20px; }
  .row { display: flex; gap: 9px; }
  .thumb { width: 128px; }
  .frame { width: 128px; height: 168px; overflow: hidden; background: #fff;
    border: 1px solid var(--border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-md); }
  .page { width: 794px; transform: scale(0.1612); transform-origin: top left; }
  .cap { font-size: 11px; color: var(--text-body); font-weight: 500; text-align: center; margin-top: 7px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const NS = window.CVBuilderDesignSystem_1d5ed3;
    const { ClassicResume, ModernResume, MinimalResume, ExecutiveResume, SidebarResume, SampleResume, SampleMeta } = NS;
    const items = [
      ['Classic', ClassicResume, SampleMeta.classic],
      ['Modern', ModernResume, SampleMeta.modern],
      ['Minimal', MinimalResume, SampleMeta.minimal],
      ['Executive', ExecutiveResume, SampleMeta.executive],
      ['Sidebar', SidebarResume, SampleMeta.sidebar],
    ];
    function Demo() {
      return (
        <div className="row">
          {items.map(([name, T, meta]) => (
            <div className="thumb" key={name}>
              <div className="frame"><div className="page"><T data={SampleResume} meta={meta} /></div></div>
              <div className="cap">{name}</div>
            </div>
          ))}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
