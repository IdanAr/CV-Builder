name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: this workflow only checks out and tests code (security
# audit SEC-011). Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-builder
    steps:
      # Actions are pinned to full commit SHAs, with the tag as a comment, so a
      # moved or hijacked tag can't change what runs here. Bump them
      # deliberately (Dependabot can do it for you).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cv-builder/package-lock.json

      - name: Cache MongoDB binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('cv-builder/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      # Catches the build-only failure modes that lint/tsc/test structurally
      # cannot see — Turbopack panics, `outputFileTracingIncludes` glob
      # semantics, and font tracing into the PDF/preview routes. See the long
      # comments in cv-builder/next.config.mjs; a silent tracing regression
      # there surfaces only as a production PDF bug.
      #
      # MONGODB_URI is a placeholder, not a credential. `next build` collects
      # page data, which evaluates lib/db.ts and lib/mongodb.ts at module
      # scope, and both throw when it is unset. Nothing connects to it — the
      # build only requires the variable to be defined. Verified: this is the
      # only variable the build needs.
      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci-build-placeholder
